[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkwindow"
version = "0.1.0"
description = "Forecasts when commuter parking spaces open and recommends a departure time."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Belo" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Newer Starlette versions warn that their test client is moving off httpx;
    # harmless for these tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]
